<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Tráfego</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const fmtBRL = (n) => isFinite(n) ? n.toLocaleString("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 2 }) : "—";
        const fmtNum = (n, d = 2) => isFinite(n) ? n.toLocaleString("pt-BR", { maximumFractionDigits: d, minimumFractionDigits: 0 }) : "—";
        const pct = (n, d = 2) => isFinite(n) ? `${n.toLocaleString("pt-BR", { maximumFractionDigits: d })}%` : "—";
        const num = (v) => {
          const x = parseFloat(String(v).replace(/\./g, "").replace(",", "."));
          return isNaN(x) ? 0 : x;
        };

        const NICHOS = {
          odonto: { label: "Odontologia / Saúde", margem: 70, ctrBom: 1.5, convBom: 8 },
          info: { label: "Infoproduto / Curso", margem: 90, ctrBom: 2, convBom: 3 },
          ecom: { label: "E-commerce / Produto", margem: 35, ctrBom: 1.2, convBom: 2 },
          servico: { label: "Serviço local / Lead", margem: 60, ctrBom: 1.5, convBom: 10 },
        };

        function App() {
          const [nicho, setNicho] = useState("odonto");
          const [d, setD] = useState({
            investimento: "300",
            faturamento: "1500",
            impressoes: "45000",
            cliques: "900",
            conversoes: "8",
            margem: "70",
          });
          const [escala, setEscala] = useState(0); 
          const [clock, setClock] = useState(new Date());
          const [ia, setIa] = useState({ loading: false, text: "", err: "" });

          useEffect(() => {
            const t = setInterval(() => setClock(new Date()), 1000);
            return () => clearInterval(t);
          }, []);

          useEffect(() => {
            setD((p) => ({ ...p, margem: String(NICHOS[nicho].margem) }));
          }, [nicho]);

          const set = (k) => (e) => setD((p) => ({ ...p, [k]: e.target.value }));

          const m = useMemo(() => {
            const inv = num(d.investimento);
            const fat = num(d.faturamento);
            const imp = num(d.impressoes);
            const cli = num(d.cliques);
            const conv = num(d.conversoes);
            const margem = num(d.margem) / 100;

            const ctr = (cli / imp) * 100;
            const cpc = inv / cli;
            const cpm = (inv / imp) * 1000;
            const txConv = (conv / cli) * 100;
            const cpa = inv / conv;
            const roas = fat / inv;
            const roi = ((fat - inv) / inv) * 100;
            const ticket = fat / conv;
            const lucro = fat * margem - inv; 
            const roasEquilibrio = 1 / margem; 
            const margemLiq = (lucro / fat) * 100;

            return { inv, fat, imp, cli, conv, margem, ctr, cpc, cpm, txConv, cpa, roas, roi, ticket, lucro, roasEquilibrio, margemLiq };
          }, [d]);

          const diag = useMemo(() => {
            const b = NICHOS[nicho];
            const out = [];
            if (m.roas >= m.roasEquilibrio * 1.2) out.push(["ok", "Lucrativa", "ROAS acima do ponto de equilíbrio. Pode escalar."]);
            else if (m.roas >= m.roasEquilibrio) out.push(["warn", "Empatando", "ROAS perto do equilíbrio. Otimize antes de escalar."]);
            else out.push(["bad", "No prejuízo", "ROAS abaixo do necessário para empatar. Revise oferta e segmentação."]);
            
            if (m.ctr >= b.ctrBom) out.push(["ok", "Criativo atraindo", "O anúncio prende atenção e está acima da média."]);
            else out.push(["warn", "Criativo fraco", "CTR abaixo da meta recomendada. Teste novos ganchos."]);
            
            if (m.txConv >= b.convBom) out.push(["ok", "Página convertendo", "Boa taxa de conversão no destino final."]);
            else out.push(["warn", "Conversão baixa", "Gargalo pode estar na experiência da página ou oferta."]);
            return out;
          }, [m, nicho]);

          const sim = useMemo(() => {
            const fator = 1 + escala / 100;
            const invN = m.inv * fator;
            const cpaN = m.cpa * (1 + (escala / 100) * 0.5);
            const convN = invN / cpaN;
            const fatN = convN * m.ticket;
            const lucroN = fatN * m.margem - invN;
            return { invN, convN, fatN, lucroN, cpaN };
          }, [escala, m]);

          const statusGlobal = m.lucro > 0 ? "LUCRO" : m.lucro === 0 ? "NEUTRO" : "PREJUÍZO";
          const statusCor = m.lucro > 0 ? "#34d399" : m.lucro < 0 ? "#f87171" : "#fbbf24";

          return (
            <div className="wrap">
              <style>{`
                @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=Manrope:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap');
                * { box-sizing: border-box; margin: 0; padding: 0; }
                :root{
                  --bg:#070a0c; --panel:#0e1418; --panel2:#121a1f; --line:#1d272e;
                  --txt:#e7eef0; --muted:#7e8d93; --green:#34d399; --amber:#fbbf24; --red:#f87171; --accent:#34d399;
                }
                body { background: var(--bg); }
                .wrap{
                  font-family:'Manrope',sans-serif; color:var(--txt);
                  min-height:100vh; padding:22px; position:relative;
                }
                .mono{ font-family:'JetBrains Mono',monospace; }
                .top{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; margin-bottom:22px; border-bottom:1px solid var(--line); padding-bottom:18px;}
                .brand{ display:flex; align-items:center; gap:12px;}
                .dot{ width:11px; height:11px; border-radius:50%; background:var(--green); box-shadow:0 0 14px var(--green); }
                h1{ font-family:'Archivo'; font-weight:900; font-size:23px; letter-spacing:-.5px; text-transform:uppercase;}
                h1 span{ color:var(--accent);}
                .sub{ color:var(--muted); font-size:12px; letter-spacing:.5px;}
                .clock{ text-align:right;}
                .clock .t{ font-family:'JetBrains Mono'; font-size:20px; font-weight:700; color:var(--accent);}
                .clock .d{ color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:1px;}
                .grid{ display:grid; gap:14px;}
                .panel{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px;}
                .ptitle{ font-family:'Archivo'; font-weight:700; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:14px; display:flex; align-items:center; gap:8px;}
                .inputs{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px;}
                .field label{ display:block; font-size:11px; color:var(--muted); margin-bottom:6px; text-transform:uppercase;}
                .field input{ width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--txt); padding:11px 12px; border-radius:9px; font-family:'JetBrains Mono'; font-size:15px; font-weight:700;}
                .selectrow{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
                .chip{ padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--muted); font-size:12px; font-weight:600; cursor:pointer;}
                .chip.on{ background:var(--accent); color:#06120c; border-color:var(--accent); font-weight:700;}
                .bigcards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px;}
                .big{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; position:relative; overflow:hidden;}
                .big .k{ font-size:11px; color:var(--muted); text-transform:uppercase;}
                .big .v{ font-family:'JetBrains Mono'; font-weight:700; font-size:26px; margin-top:8px; line-height:1;}
                .big .sub2{ font-size:11px; color:var(--muted); margin-top:6px;}
                .mini{ display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:1px; background:var(--line); border-radius:12px; overflow:hidden;}
                .mcell{ background:var(--panel); padding:14px;}
                .mcell .k{ font-size:10px; color:var(--muted); text-transform:uppercase;}
                .mcell .v{ font-family:'JetBrains Mono'; font-weight:700; font-size:16px; margin-top:5px;}
                .diagrow{ display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line);}
                .led{ width:10px; height:10px; border-radius:50%; margin-top:5px; flex:none;}
                .diagrow .tt{ font-family:'Archivo'; font-weight:700; font-size:14px;}
                .diagrow .dd{ font-size:12px; color:var(--muted); margin-top:2px;}
                .slider{ width:100%; height:6px; border-radius:6px; background:var(--line); margin:14px 0; outline:none;}
                .simgrid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px;}
                .simbox{ background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:14px;}
                .simbox .k{ font-size:10px; color:var(--muted); text-transform:uppercase;}
                .simbox .v{ font-family:'JetBrains Mono'; font-weight:700; font-size:17px; margin-top:5px;}
                .cols{ display:grid; grid-template-columns:1fr 1fr; gap:14px;}
                @media(max-width:760px){ .cols{ grid-template-columns:1fr;} .simgrid{ grid-template-columns:1fr;} }
              `}</style>

              <div className="top">
                <div className="brand">
                  <div className="dot" />
                  <div>
                    <h1>Central de <span>Tráfego</span></h1>
                    <div className="sub">PAINEL DE PERFORMANCE EM TEMPO REAL</div>
                  </div>
                </div>
                <div className="clock">
                  <div className="t mono">{clock.toLocaleTimeString("pt-BR")}</div>
                  <div className="d">{clock.toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "short" })}</div>
                </div>
              </div>

              <div className="grid">
                <div className="panel">
                  <div className="ptitle">Dados da campanha</div>
                  <div className="selectrow">
                    {Object.entries(NICHOS).map(([k, v]) => (
                      <div key={k} className={`chip ${nicho === k ? "on" : ""}`} onClick={() => setNicho(k)}>{v.label}</div>
                    ))}
                  </div>
                  <div className="inputs">
                    <div className="field"><label>Investimento (R$)</label><input value={d.investimento} onChange={set("investimento")} /></div>
                    <div className="field"><label>Faturamento (R$)</label><input value={d.faturamento} onChange={set("faturamento")} /></div>
                    <div className="field"><label>Impressões</label><input value={d.impressoes} onChange={set("impressoes")} /></div>
                    <div className="field"><label>Cliques</label><input value={d.cliques} onChange={set("cliques")} /></div>
                    <div className="field"><label>Vendas</label><input value={d.conversoes} onChange={set("conversoes")} /></div>
                    <div className="field"><label>Margem de contrib. (%)</label><input value={d.margem} onChange={set("margem")} /></div>
                  </div>
                </div>

                <div className="bigcards">
                  <div className="big">
                    <div className="k">ROAS</div>
                    <div className="v" style={{ color: m.roas >= m.roasEquilibrio ? "var(--green)" : "var(--red)" }}>{fmtNum(m.roas)}x</div>
                    <div className="sub2">Equilíbrio: {fmtNum(m.roasEquilibrio)}x</div>
                  </div>
                  <div className="big">
                    <div className="k">ROI</div>
                    <div className="v" style={{ color: m.roi >= 0 ? "var(--green)" : "var(--red)" }}>{pct(m.roi, 0)}</div>
                    <div className="sub2">Retorno sobre investimento</div>
                  </div>
                  <div className="big">
                    <div className="k">Lucro real</div>
                    <div className="v" style={{ color: statusCor }}>{fmtBRL(m.lucro)}</div>
                    <div className="sub2">Margem de contribuição aplicada</div>
                  </div>
                  <div className="big">
                    <div className="k">CPA (custo/venda)</div>
                    <div className="v">{fmtBRL(m.cpa)}</div>
                    <div className="sub2">Ticket médio: {fmtBRL(m.ticket)}</div>
                  </div>
                </div>

                <div className="mini">
                  <div className="mcell"><div className="k">CTR</div><div className="v">{pct(m.ctr)}</div></div>
                  <div className="mcell"><div className="k">CPC</div><div className="v">{fmtBRL(m.cpc)}</div></div>
                  <div className="mcell"><div className="k">CPM</div><div className="v">{fmtBRL(m.cpm)}</div></div>
                  <div className="mcell"><div className="k">Tx. Conversão</div><div className="v">{pct(m.txConv)}</div></div>
                  <div className="mcell"><div className="k">Margem líq.</div><div className="v">{pct(m.margemLiq, 0)}</div></div>
                  <div className="mcell"><div className="k">Status</div><div className="v" style={{ color: statusCor }}>{statusGlobal}</div></div>
                </div>

                <div className="cols">
                  <div className="panel">
                    <div className="ptitle">Diagnóstico automático</div>
                    {diag.map((row, i) => (
                      <div className="diagrow" key={i}>
                        <div className="led" style={{ background: row[0] === "ok" ? "var(--green)" : row[0] === "warn" ? "var(--amber)" : "var(--red)" }} />
                        <div>
                          <div className="tt">{row[1]}</div>
                          <div className="dd">{row[2]}</div>
                        </div>
                      </div>
                    ))}
                  </div>

                  <div className="panel">
                    <div className="ptitle">Simulador de escala</div>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13 }}>
                      <span style={{ color: "var(--muted)" }}>Aumentar orçamento</span>
                      <span
